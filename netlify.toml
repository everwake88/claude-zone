# Everwake — deployment settings.
# With this file in the repository, Netlify configures itself. You do not need
# to type a build command or a publish directory when connecting the site.

[build]
  publish = "EVERWAKE WEBSITE/web"
  command = ""

# Pages that no longer exist, sent somewhere useful.
[[redirects]]
  from = "/approach.html"
  to = "/pricing.html#how-pricing-works"
  status = 301
[[redirects]]
  from = "/work.html"
  to = "/index.html#proof"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

# The settings file must never be cached, or edits appear to do nothing.
[[headers]]
  for = "/site-config.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
